# The method's checks on GitHub (tools/ci.py on the method branch): every
# branch head built with each variant and its headroom reported; commits
# made after [ci] check_after given the commit-msg hook's checks. Results are
# commit statuses (method/build, method/commits) and the run's summary. It
# runs in this fork only and sends nothing anywhere else.
name: method checks

on:
  push:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: method-checks
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'TrongDog/uCDD'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.METHOD_REF || 'claude/brave-franklin-6h9xzo' }}
          path: .method
      # The reference library beside the method checkout, where [references].worktree ("../refs" from
      # .method) finds it: a commit that cites a data sheet is checked against it (lib/refcheck.py).
      # Missing until 10 Nov 2026: the rewrite gave old commits new ids, the checks read them again,
      # and five feature-branch commits failed on "the reference library worktree is missing".
      - uses: actions/checkout@v4
        with:
          ref: reference-library
          path: refs
      - name: Install NASM
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm
      # Nothing personal goes to GitHub (lib/privacy.py, r3.10): the hooks read the owner's own
      # entries from method.local.toml on the bench; a commit made anywhere else (the web editor, a
      # clone without the hooks) is read here, an hour later at most, when the repository holds
      # the same entries as the secret METHOD_LOCAL_TOML. Without the secret only method.toml's
      # entries are read. A refusal names the rule, never the word, in the log and the status alike.
      - name: The owner's own entries, when the repository holds them as a secret
        env:
          METHOD_LOCAL_TOML: ${{ secrets.METHOD_LOCAL_TOML }}
        run: |
          if [ -n "$METHOD_LOCAL_TOML" ]; then printf '%s\n' "$METHOD_LOCAL_TOML" > .method/method.local.toml; fi
      - name: Build every branch and check new commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .method/tools/ci.py --repo "$GITHUB_REPOSITORY"
